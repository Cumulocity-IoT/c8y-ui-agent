packages:
  - packages/*

# Supply-chain settings, the same as in the Cumulocity UI SDK.
# A version must be at least 7 days (10080 minutes) old before it is installed. Exclude only our own packages.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@cumulocity-iot/*'

# No lifecycle scripts (preinstall/postinstall): neither dependencies' nor this workspace's own, so `pnpm publish`
# skips prepack/prepublishOnly too. Build explicitly before publishing.
ignoreScripts: true
# An unmet peer dependency fails the install.
strictPeerDependencies: true

# Refuse a version published with weaker trust evidence than an earlier one of the same package.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600

# pnpm audit gates CI on high and critical advisories.
audit:
  level: high

# One version per dependency across the packages.
catalog:
  typescript: ^6.0.3
  vitest: ^5.0.2
  tsdown: ^0.23.0
  '@types/node': ^24.12.3

# Security fixes in transitive dependencies. Remove an entry once its parent depends on the fixed version.
overrides:
  'undici@7': ^7.30.1         # via @cumulocity-iot/ui-sdk > @module-federation/vite
  'body-parser@2': ^2.4.0     # via @modelcontextprotocol/sdk > express

# Advisories without a fixed release, with the reason they are accepted. Recheck on every Cypress or SDK update.
auditConfig:
  ignoreGhsas:
    # extract-zip 2.0.1 (arbitrary file write and path traversal through symlinks), via @cumulocity-iot/ui-sdk > cypress:
    # no fixed release. Cypress uses it only to unpack its own binary, which installs here never download (ignoreScripts).
    - GHSA-7pqw-9j4j-h8q3
    - GHSA-jmr9-qjv8-65gv
