# Publishes @cumulocity-iot/c8y-ui-workbench to GitHub Packages with semantic-release
# (release.config.mjs) after CI passed: main → latest, next → prereleases (dist-tag next).
# Whether a push releases, and which version, follows from its conventional commits.
name: Release

on:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # A called workflow gets at most what its caller grants.
    permissions:
      contents: read
      packages: read

  release:
    name: semantic-release
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write        # tag + GitHub release
      issues: write          # "released in" comments, failure issues
      pull-requests: write   # "released in" comments
      packages: write        # publish to GitHub Packages
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # all commits and tags since the last release
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@cumulocity-iot'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
