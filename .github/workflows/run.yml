# The C8Y UI Agent's run, called by a repository's workflow on issue events (docs/workflow.md).
#
#   filter   Does the event start a run, for which issue and playbook (c8y-ui-apply route)? No checkout.
#   context  Read token: the playbook from the default branch, the issue thread as files, the base commit.
#   agent    No GitHub credential: Claude Code with the agent pack, the workbench, and the Web SDK knowledge server.
#   apply    A fresh runner: checks the agent's result and bundle, then writes with an App token (docs/result.md).
#
# The pack comes from this repository at the workflow's own commit (job.workflow_sha), and the packages from the
# release whose tag points to that commit, so a caller that pins run.yml@v<version> gets one consistent version (D19).
name: C8Y UI Agent run

on:
  workflow_call:
    inputs:
      model:
        description: Model of the orchestrator and the developer; the verifier uses sonnet
        type: string
        default: claude-opus-5-5
      rounds:
        description: Develop-and-prove rounds of a playbook
        type: number
        default: 3
      max-budget-usd:
        description: Model spend limit of one run, in US dollars
        type: number
        default: 10
      timeout-minutes:
        description: Time limit of the agent job
        type: number
        default: 60
      package-version:
        description: Version of the packages, for testing the workflow from a branch; default the release at the workflow's commit
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      C8Y_UI_AGENT_CLIENT_ID:
        required: false
      C8Y_UI_AGENT_APP_KEY:
        required: false

permissions: {}

env:
  CLAUDE_CODE_VERSION: 2.1.323
  KNOWLEDGE_VERSION: 0.1.4
  NODE_VERSION: 24

jobs:
  filter:
    # Unrelated comments and labels end here, before a runner starts. route decides the rest.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issues' && github.event.action == 'labeled' && startsWith(github.event.label.name, 'agent:'))
      || (github.event_name == 'issue_comment' && github.event.action == 'created' && contains(github.event.comment.body, '@c8y-ui-agent'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: read
    outputs:
      run: ${{ steps.route.outputs.run }}
      number: ${{ steps.route.outputs.number }}
      playbook: ${{ steps.route.outputs.playbook }}
      trigger: ${{ steps.route.outputs.trigger }}
      comment: ${{ steps.route.outputs.comment }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Find the release of this workflow
        id: version
        env:
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ job.workflow_repository }}
          REF: ${{ job.workflow_ref }}
          SHA: ${{ job.workflow_sha }}
          OVERRIDE: ${{ inputs.package-version }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            version="$OVERRIDE"
          else
            version=$(git ls-remote --tags "$SERVER/$REPOSITORY.git" 'refs/tags/v*' \
              | awk -v sha="$SHA" '$1 == sha { print $2 }' \
              | sed -e 's#^refs/tags/v##' -e 's#\^{}$##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::No release tag v<version> points to $REF ($SHA). Call run.yml at a release tag, or set the input package-version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: '@cumulocity-iot'
      - name: Install c8y-ui-apply
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: npm install --ignore-scripts --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/apply" "@cumulocity-iot/c8y-ui-apply@$VERSION"
      - name: Route the event
        id: route
        run: '"$RUNNER_TEMP/apply/node_modules/.bin/c8y-ui-apply" route > /dev/null'

  context:
    needs: filter
    if: needs.filter.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      packages: read
    outputs:
      number: ${{ needs.filter.outputs.number }}
      playbook: ${{ needs.filter.outputs.playbook }}
      playbook-result: ${{ steps.playbook.outputs.result }}
      evidence: ${{ steps.playbook.outputs.evidence }}
      error: ${{ steps.playbook.outputs.error }}
      base: ${{ steps.context.outputs.base || steps.default.outputs.sha }}
      default-branch: ${{ github.event.repository.default_branch }}
    env:
      NUMBER: ${{ needs.filter.outputs.number }}
      PLAYBOOK: ${{ needs.filter.outputs.playbook }}
      APPLY: ${{ github.workspace }}/.apply/node_modules/.bin/c8y-ui-apply
    steps:
      # The default branch decides the playbooks, the protected paths, and the base: never the agent's branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repo
          persist-credentials: false
          sparse-checkout: .c8y-agent
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: c8y-ui-agent
          persist-credentials: false
          sparse-checkout: pack
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: '@cumulocity-iot'
      - name: Install c8y-ui-apply
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.filter.outputs.version }}
        run: npm install --ignore-scripts --no-save --no-audit --no-fund --prefix .apply "@cumulocity-iot/c8y-ui-apply@$VERSION"
      - name: Default branch head
        id: default
        run: echo "sha=$(git -C repo rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve the playbook
        id: playbook
        # Exit 1 with the step output error: the repository cannot run the playbook; the apply job reports it.
        run: |
          mkdir -p "$RUNNER_TEMP/agent-context"
          code=0
          "$APPLY" playbook "$PLAYBOOK" --pack c8y-ui-agent/pack --dir repo --prompt "$RUNNER_TEMP/agent-context/system.md" > /dev/null || code=$?
          [ "$code" -le 1 ] || exit "$code"
      - name: Write the issue thread
        id: context
        if: steps.playbook.outputs.error == ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ needs.filter.outputs.comment }}
          DEFAULT_SHA: ${{ steps.default.outputs.sha }}
        run: |
          "$APPLY" context --number "$NUMBER" --playbook "$PLAYBOOK" --default-sha "$DEFAULT_SHA" \
            --out "$RUNNER_TEMP/agent-context/context" ${COMMENT:+--comment "$COMMENT"} > /dev/null
      - uses: actions/upload-artifact@v7
        if: steps.playbook.outputs.error == ''
        with:
          name: agent-context
          path: ${{ runner.temp }}/agent-context
          retention-days: 7

  agent:
    needs: [filter, context]
    if: needs.context.outputs.error == ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # One run per issue at a time. A newer trigger replaces a pending one; a running one finishes.
    concurrency:
      group: c8y-ui-agent-${{ github.repository }}-${{ needs.context.outputs.number }}
      cancel-in-progress: false
    # Checkout and package installs only. The agent gets no GitHub token; it can still reach the runner's Actions
    # runtime token (docs/result.md, Limits).
    permissions:
      contents: read
      packages: read
    env:
      NUMBER: ${{ needs.context.outputs.number }}
      PLAYBOOK: ${{ needs.context.outputs.playbook }}
      BASE: ${{ needs.context.outputs.base }}
      VERSION: ${{ needs.filter.outputs.version }}
    steps:
      - name: Check the model key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: '[ -n "$KEY" ] || { echo "::error::The secret ANTHROPIC_API_KEY is not set: pass it with secrets: inherit."; exit 1; }'
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.base }}
          path: repo
          fetch-depth: 0          # prove_regression's base: the merge base with the default branch
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: c8y-ui-agent
          persist-credentials: false
          sparse-checkout: pack
      - uses: actions/download-artifact@v8
        with:
          name: agent-context
          path: ${{ runner.temp }}/run
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: '@cumulocity-iot'
      - name: Install the repository's dependencies
        working-directory: repo
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "::error::No pnpm-lock.yaml or package-lock.json at the repository's root: the agent supports pnpm and npm."
            exit 1
          fi
      - name: Install the agent's tools
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/tools" \
            "@cumulocity-iot/c8y-ui-workbench@$VERSION" "@cumulocity-iot/c8y-ui-apply@$VERSION" \
            "@cumulocity-iot/c8y-web-sdk-knowledge-mcp@$KNOWLEDGE_VERSION" "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Prepare the run
        working-directory: repo
        run: |
          run="$RUNNER_TEMP/run"
          git switch --quiet -c "agent/$NUMBER-$PLAYBOOK"
          git config user.name 'c8y-ui-agent[bot]'
          git config user.email 'c8y-ui-agent[bot]@users.noreply.github.com'
          mkdir -p "$run/screenshots"
          c8y-ui-workbench profile > "$run/profile.json"
          # The servers' names are part of the pack: the verifier's tool list uses them.
          RUN="$run" REPO="$PWD" TOOLS="$RUNNER_TEMP/tools/node_modules/.bin" node -e '
            const { RUN, REPO, TOOLS } = process.env
            require("node:fs").writeFileSync(`${RUN}/mcp.json`, JSON.stringify({ mcpServers: {
              "c8y-ui-workbench": { command: `${TOOLS}/c8y-ui-workbench`, args: ["--repo", REPO, "--screenshots", `${RUN}/screenshots`] },
              "c8y-web-sdk-knowledge": { command: `${TOOLS}/c8y-web-sdk-knowledge-mcp`, args: [] },
            } }, null, 2))'
          # Claude Code reads no project settings here (--setting-sources user), so the repository's skills come in as
          # a second plugin, "repository" (D19).
          skills="$RUNNER_TEMP/repository-skills"
          for dir in .claude/skills .c8y-agent/skills; do
            [ -d "$dir" ] || continue
            for skill in "$dir"/*/; do
              [ -f "$skill/SKILL.md" ] || continue
              mkdir -p "$skills/skills"
              cp -R "${skill%/}" "$skills/skills/"
            done
          done
          if [ -d "$skills/skills" ]; then
            mkdir -p "$skills/.claude-plugin"
            echo '{ "name": "repository", "version": "0.0.0", "description": "The repository'"'"'s skills" }' > "$skills/.claude-plugin/plugin.json"
          fi
      - name: Run the agent
        id: agent
        continue-on-error: true   # a failed or stopped agent still reaches the apply job, which reports it
        working-directory: repo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_AUTOUPDATER: '1'
          MODEL: ${{ inputs.model }}
          ROUNDS: ${{ inputs.rounds }}
          BUDGET: ${{ inputs.max-budget-usd }}
          REPOSITORY: ${{ github.repository }}
        run: |
          run="$RUNNER_TEMP/run"
          plugins=(--plugin-dir "$GITHUB_WORKSPACE/c8y-ui-agent/pack")
          if [ -d "$RUNNER_TEMP/repository-skills/skills" ]; then
            plugins+=(--plugin-dir "$RUNNER_TEMP/repository-skills")
          fi
          task="Playbook: $PLAYBOOK
          Issue: #$NUMBER in $REPOSITORY
          Base: $BASE
          Run directory: $run
          Rounds: $ROUNDS"
          claude -p "$task" \
            --model "$MODEL" \
            --append-system-prompt-file "$run/system.md" \
            "${plugins[@]}" \
            --setting-sources user \
            --strict-mcp-config --mcp-config "$run/mcp.json" \
            --permission-mode dontAsk \
            --allowedTools Bash Read Glob Grep Edit Write MultiEdit NotebookEdit TodoWrite Task Agent Skill \
              mcp__c8y-ui-workbench mcp__c8y-web-sdk-knowledge \
            --add-dir "$run" \
            --max-budget-usd "$BUDGET" \
            --output-format stream-json --verbose --no-session-persistence \
            < /dev/null > "$RUNNER_TEMP/transcript.ndjson"
      - name: Summary
        if: ${{ !cancelled() }}
        # Numbers only: the transcript stays on the runner, because it can hold anything the agent read.
        run: |
          node -e '
            const lines = require("node:fs").readFileSync(process.argv[1], "utf8").trim().split("\n")
            let r = {}
            for (const line of lines.reverse()) { try { const e = JSON.parse(line); if (e.type === "result") { r = e; break } } catch {} }
            const n = v => Number.isFinite(Number(v)) ? Number(v) : "?"
            const usd = Number.isFinite(Number(r.total_cost_usd)) ? Number(r.total_cost_usd).toFixed(2) : "?"
            const row = `| ${String(r.subtype ?? "no result").replace(/[^a-z_]/g, "")} | ${n(r.num_turns)} | ${usd} | ${Math.round(n(r.duration_ms) / 1000)} |`
            require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `| Agent | Turns | USD | Seconds |\n|---|---|---|---|\n${row}\n`)
          ' "$RUNNER_TEMP/transcript.ndjson" || true
      - name: Bundle the result
        if: ${{ !cancelled() }}
        working-directory: repo
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          result="$RUNNER_TEMP/run/result.json"
          if [ -f "$result" ] && [ ! -L "$result" ]; then cp "$result" "$out/result.json"; fi
          c8y-ui-apply bundle --base "$BASE" --out "$out/agent.bundle" > /dev/null
          # Not a boundary (the agent controls this runner), but it keeps the model key out of a careless result.
          if { [ -f "$out/result.json" ] && grep -qF -- "$KEY" "$out/result.json"; } || git log -p "$BASE..HEAD" | grep -F -- "$KEY" > /dev/null; then
            echo "::error::The result contains the model key: nothing is uploaded."
            rm -rf "$out"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: agent-result
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 30   # a rejected result's commits stay here

  apply:
    needs: [filter, context, agent]
    # Also after a failed or skipped agent job: a missing result.json and a playbook error get a status comment too.
    if: ${{ !cancelled() && needs.context.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      NUMBER: ${{ needs.context.outputs.number }}
      PLAYBOOK: ${{ needs.context.outputs.playbook }}
      PLAYBOOK_RESULT: ${{ needs.context.outputs.playbook-result }}
      BASE: ${{ needs.context.outputs.base }}
      DEFAULT_BRANCH: ${{ needs.context.outputs.default-branch }}
      ERROR: ${{ needs.context.outputs.error }}
      TRIGGER: ${{ needs.filter.outputs.trigger }}
      VERSION: ${{ needs.filter.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.default-branch }}
          path: repo
          fetch-depth: 0
          persist-credentials: false
      # No cache: the agent job can write the default branch's Actions caches.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: '@cumulocity-iot'
      - name: Install c8y-ui-apply
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm install --ignore-scripts --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/apply" "@cumulocity-iot/c8y-ui-apply@$VERSION"
      # The agent's files arrive after the tool is installed, outside the checkout.
      - uses: actions/download-artifact@v8
        if: needs.context.outputs.error == ''
        continue-on-error: true   # no artifact: check reports the missing result.json
        with:
          name: agent-result
          path: ${{ runner.temp }}/agent
      - name: Report the playbook error
        if: needs.context.outputs.error != ''
        run: |
          mkdir -p "$RUNNER_TEMP/agent"
          node -e '
            const { PLAYBOOK, ERROR } = process.env
            const summary = `**The agent cannot run \`${PLAYBOOK}\`:** ${ERROR}`.slice(0, 60000)
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify({ version: 1, outcome: "failed", summary }))
          ' "$RUNNER_TEMP/agent/result.json"
      - id: check
        continue-on-error: true   # a crash leaves ok unset: the report token and apply still run
        run: |
          "$RUNNER_TEMP/apply/node_modules/.bin/c8y-ui-apply" check --dir repo \
            --result "$RUNNER_TEMP/agent/result.json" --bundle "$RUNNER_TEMP/agent/agent.bundle" \
            --base "$BASE" --default-branch "$DEFAULT_BRANCH" --number "$NUMBER" --playbook "$PLAYBOOK" \
            ${PLAYBOOK_RESULT:+--playbook-result "$PLAYBOOK_RESULT"} > /dev/null
      # A passed check gets a token that can push; anything else only a token that can comment and label.
      - id: write
        if: steps.check.outputs.ok == 'true' && needs.context.outputs.error == ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.C8Y_UI_AGENT_CLIENT_ID }}
          private-key: ${{ secrets.C8Y_UI_AGENT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: report
        if: steps.check.outputs.ok != 'true' || needs.context.outputs.error != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.C8Y_UI_AGENT_CLIENT_ID }}
          private-key: ${{ secrets.C8Y_UI_AGENT_APP_KEY }}
          permission-pull-requests: write
          permission-issues: write
      - name: Apply
        env:
          GH_TOKEN: ${{ steps.write.outputs.token || steps.report.outputs.token }}
          SLUG: ${{ steps.write.outputs.app-slug || steps.report.outputs.app-slug }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          remove=()
          # A label started the run: remove it, so adding it again starts the next run.
          if [ "$TRIGGER" = label ]; then remove=(--remove-label "agent:$PLAYBOOK"); fi
          "$RUNNER_TEMP/apply/node_modules/.bin/c8y-ui-apply" apply --dir repo \
            --result "$RUNNER_TEMP/agent/result.json" --bundle "$RUNNER_TEMP/agent/agent.bundle" \
            --base "$BASE" --default-branch "$DEFAULT_BRANCH" --number "$NUMBER" --playbook "$PLAYBOOK" \
            ${PLAYBOOK_RESULT:+--playbook-result "$PLAYBOOK_RESULT"} \
            --bot-login "$SLUG[bot]" --run-url "$RUN_URL" "${remove[@]}" > /dev/null
