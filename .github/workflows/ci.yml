# Build, typecheck and test the workspace.
# Runs on pull requests; on main and next it runs as the first stage of release.yml.
# Pull requests from forks run only after a maintainer approves them (repository setting): review workflow
# changes first, because the run can read internal packages.

name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Build, typecheck, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18.0', 24]   # engines: the floor tsdown sets, and the current LTS
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86   # v6.0.10; version from packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@cumulocity-iot'
      - run: pnpm audit                    # all dependencies, dev included (semantic-release runs with write tokens)
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # One status check for the Node matrix, for a branch ruleset to require.
  # `!cancelled()`, not `always()`: a run cancelled by a newer one must not report a failure.
  test-result:
    name: Build, typecheck, test
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every Node version passed
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
