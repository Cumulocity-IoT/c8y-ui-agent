# Pull requests are squash-merged and the PR title becomes the commit message,
# so it must be a conventional commit: it decides the next release (CONTRIBUTING.md).
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9-]+\))?!?: .+'
          if [[ "$TITLE" =~ $pattern ]]; then echo "✔ $TITLE"; exit 0; fi
          echo "::error::The PR title must be a conventional commit, e.g. 'feat(workbench): add X', 'fix(workflow): Y' or 'docs: Z' — got: $TITLE"
          exit 1
